<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>비밀번호 변경 | 해비치 급식 App</title>
<link rel="stylesheet" href="resources/css/reset.css">
<link rel="stylesheet" href="resources/css/style.css">
<link rel="stylesheet" href="resources/css/theme-hyundaicapital.css" id="themeLink">
</head>
<body>
<!-- HVM-MO-11-00: 로그인 상태에서 현재 비밀번호 확인 후 새 비밀번호 등록 -->
<div class="page">
  <header class="hd-sub">
    <a class="back-btn" href="my.html" aria-label="My로 돌아가기"><img src="resources/images/icon/ic-back.svg" alt=""></a>
    <span class="hd-sub-date">비밀번호 변경</span>
    <span class="hd-sub-spacer" aria-hidden="true"></span>
  </header>

  <main class="content password-content">
    <form class="password-body" id="passwordChangeForm" novalidate>
      <section class="password-step" data-password-step="1">
        <p class="password-step-count">1 / 2</p>
        <h1>현재 비밀번호를<br>입력해주세요</h1>
        <p class="password-description">안전한 변경을 위해 현재 비밀번호를 확인해요.</p>
        <div class="field signup-field">
          <label for="currentPassword">현재 비밀번호</label>
          <input class="input" id="currentPassword" type="password" placeholder="비밀번호 입력" autocomplete="current-password" required>
          <p class="form-message is-error" id="currentPasswordError" hidden>현재 비밀번호를 입력해주세요.</p>
        </div>
        <button class="btn btn-primary" type="button" id="passwordVerify">확인</button>
      </section>

      <section class="password-step" data-password-step="2" hidden>
        <p class="password-step-count">2 / 2</p>
        <h1>새 비밀번호를<br>등록해주세요</h1>
        <p class="password-description">로그인할 때 사용할 새 비밀번호를 설정해 주세요.</p>
        <div class="field signup-field">
          <label for="newPassword">새 비밀번호</label>
          <input class="input" id="newPassword" type="password" placeholder="8자 이상 입력" autocomplete="new-password" required>
          <p class="form-message is-error" id="newPasswordLengthError" hidden>비밀번호를 8자 이상 입력해주세요.</p>
        </div>
        <div class="field signup-field">
          <label for="newPasswordConfirm">새 비밀번호 확인</label>
          <input class="input" id="newPasswordConfirm" type="password" placeholder="비밀번호를 다시 입력" autocomplete="new-password" required>
          <p class="form-message is-error" id="newPasswordError" hidden>비밀번호가 일치하지 않습니다.</p>
        </div>
        <button class="btn btn-primary" type="submit">변경 완료</button>
        <button class="password-step-back" id="passwordStepBack" type="button"><span aria-hidden="true">←</span> 이전 단계로 돌아가기</button>
      </section>
    </form>
  </main>
</div>
<script src="resources/js/common.js"></script>
</body>
</html>
