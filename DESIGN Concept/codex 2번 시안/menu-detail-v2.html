<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>제육볶음 정식 | 현대캐피탈 급식</title>
  <link rel="stylesheet" href="menu-detail-v2.css">
</head>
<body>
  <!-- Codex 2번 시안의 중식 상세. 평가 전·후를 함께 보여 주는 검토용 화면이다. -->
  <div class="d2-page">
    <header class="d2-header">
      <a class="d2-back" href="home-concept-v2.html" aria-label="홈으로 돌아가기">‹</a>
      <div><p>8월 19일 수요일</p><strong>중식 상세</strong></div>
      <span class="d2-header-space" aria-hidden="true"></span>
    </header>

    <main class="d2-main">
      <section class="d2-hero" aria-labelledby="detail-title">
        <img src="images/jeyuk-bokkeum-photo-sample.png" alt="제육볶음 정식 샘플 이미지">
        <div class="d2-hero-caption"><span>중식 · 11:30 – 13:30</span><b>제공 중</b></div>
      </section>

      <section class="d2-title">
        <p>오늘의 중식</p>
        <h1 id="detail-title">제육볶음 정식</h1>
        <div class="d2-tags"><span>돼지고기 국내산</span><span>쌀 국내산</span></div>
      </section>

      <section class="d2-section" aria-labelledby="composition-title">
        <div class="d2-section-heading"><h2 id="composition-title">식단 구성</h2><span>총 6가지</span></div>
        <dl class="d2-composition"><div><dt>주식</dt><dd>잡곡밥</dd></div><div><dt>메인</dt><dd>제육볶음</dd></div><div><dt>반찬</dt><dd>계란찜 · 시금치나물 · 배추김치</dd></div><div><dt>국</dt><dd>된장국</dd></div></dl>
      </section>

      <section class="d2-nutrition" aria-label="영양 및 알레르기 정보">
        <div><small>열량</small><strong>620 <em>kcal</em></strong></div><div><small>나트륨</small><strong>980 <em>mg</em></strong></div><p><b>알레르기</b><span>대두, 돼지고기 함유</span></p>
      </section>

      <section class="d2-rating-samples" aria-labelledby="rating-title">
        <div class="d2-section-heading"><div><p>MENU RATING</p><h2 id="rating-title">메뉴 평가</h2></div><span class="sample-note">시안용</span></div>
        <div class="d2-rating-grid">
          <!-- 실제 서비스에서는 미평가 사용자에게만 노출 -->
          <article class="d2-rating before"><span class="d2-state">평가 전</span><h3>오늘의 식사는 어떠셨나요?</h3><div class="d2-stars" id="ratingControl" role="radiogroup" aria-label="별점 선택"><button type="button" data-score="1" aria-label="1점">★</button><button type="button" data-score="2" aria-label="2점">★</button><button type="button" data-score="3" aria-label="3점">★</button><button type="button" data-score="4" aria-label="4점">★</button><button type="button" data-score="5" aria-label="5점">★</button></div><p id="ratingFeedback" aria-live="polite">별점을 선택해 주세요</p><button class="d2-rate-submit" id="ratingSubmit" type="button" disabled>평가 등록</button></article>
          <!-- 실제 서비스에서는 평가 완료 사용자에게만 노출 -->
          <article class="d2-rating after"><span class="d2-state">평가 후</span><h3>내가 남긴 평가</h3><div class="d2-saved-rating"><strong>★★★★<span>★</span></strong><div><b>맛있어요</b><small>4점 · 평가 완료</small></div></div></article>
        </div>
      </section>
    </main>

    <nav class="d2-tabbar" aria-label="주요 메뉴"><a href="home-concept-v2.html"><span class="d2-icon home"></span>홈</a><a class="active" href="#"><span class="d2-icon menu"></span>식단</a><a href="#"><span class="d2-icon voice"></span>의견</a><a href="#"><span class="d2-icon bell"></span>공지</a><a href="#"><span class="d2-icon user"></span>MY</a></nav>
  </div>
  <script src="menu-detail-v2.js"></script>
</body>
</html>
