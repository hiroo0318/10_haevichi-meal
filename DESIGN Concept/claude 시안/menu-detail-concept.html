<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>식단 상세 — 상세 디자인 시안 (Claude)</title>
<link rel="stylesheet" href="menu-detail-concept.css">
</head>
<body>
<!--
  식단상세·별점 화면 디자인 검토용 독립 시안입니다 (Claude 제안).
  끼니 하나에 코너(코너 A/코너 B 등)가 여러 개일 수 있어, 헤더 바로 아래
  코너 전환 탭을 두고 탭에 따라 사진·정보·별점 상태가 전부 바뀐다.
  URL에 ?meal=lunch&corner=b 를 붙이면 해당 코너로 바로 진입한다(기본값: 중식·코너 A).
-->
<div class="page">

  <header class="hd">
    <a class="back-btn" href="home-concept.html">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <span class="hd-date">8월 19일(수)</span>
    <span class="hd-meal" id="hdMeal">중식</span>
  </header>

  <!-- 코너 전환 탭: 코너가 2개 이상인 끼니에서만 노출 -->
  <div class="corner-switch" id="cornerSwitch" hidden></div>

  <main>

    <div class="hero">
      <img id="heroPhoto" src="" alt="">
      <span class="hero-time" id="heroTime"></span>
    </div>

    <div class="sheet">

      <span class="kicker" id="kicker">LUNCH MENU</span>
      <h1 id="menuName"></h1>

      <div class="tag-row" id="tagRow"></div>

      <section class="composition" id="composition"></section>

      <section class="nutrition">
        <div class="nutri-cell">
          <span class="nutri-label">열량</span>
          <span class="nutri-value" id="nutriKcal">–<small>kcal</small></span>
        </div>
        <div class="nutri-div"></div>
        <div class="nutri-cell">
          <span class="nutri-label">나트륨</span>
          <span class="nutri-value" id="nutriSodium">–<small>mg</small></span>
        </div>
      </section>
      <div class="allergy-line"><b>알레르기</b> <span id="allergyText"></span></div>

      <section class="rate">
        <span class="kicker">MENU RATING</span>
        <h2>이 메뉴는 어떠셨나요?</h2>
        <div class="stars" id="stars">
          <button type="button" data-n="1">★</button>
          <button type="button" data-n="2">★</button>
          <button type="button" data-n="3">★</button>
          <button type="button" data-n="4">★</button>
          <button type="button" data-n="5">★</button>
        </div>
        <p class="rate-hint" id="rateHint">별점을 선택해 주세요</p>
        <button type="button" id="submitBtn" class="cta" disabled>평가 등록</button>
      </section>

    </div>

  </main>

  <nav class="tabbar">
    <a href="home-concept.html"><span class="ic ic-home"></span>홈</a>
    <a class="active" href="#"><span class="ic ic-menu"></span>식단</a>
    <a href="#"><span class="ic ic-voc"></span>의견</a>
    <a href="#"><span class="ic ic-bell"></span>공지</a>
    <a href="#"><span class="ic ic-my"></span>MY</a>
  </nav>

</div>
<script src="menu-detail-concept.js"></script>
</body>
</html>
