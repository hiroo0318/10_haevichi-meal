<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>해비치 급식 App 관리자 - 사업장 관리</title>
  <link rel="stylesheet" href="resources/css/reset.css">
  <link rel="stylesheet" href="resources/css/admin.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="dashboard.html"><img class="brand-mark" src="resources/images/brand/haevichi-auth-logo.png" alt="해비치">해비치 급식 App <em>관리자</em></a>
    <div class="profile">
      <button type="button" class="scope-trigger" id="scopeTrigger" aria-haspopup="dialog"><span id="scopeLabel">현대캐피탈</span><span class="scope-caret" aria-hidden="true">▾</span></button>
      <button type="button" class="scope-trigger" id="adminInfoTrigger" aria-haspopup="dialog"><span class="avatar">정H</span>정혜림 관리자</button>
      <button type="button" class="scope-trigger" id="adminLogoutBtn">로그아웃</button>
    </div>
  </header>
  <aside class="sidenav" aria-label="관리자 메뉴"><nav>
    <div class="nav-section"><span class="nav-label">운영</span>
      <a class="nav-link" href="dashboard.html"><span class="nav-icon">▦</span>대시보드</a>
      <button type="button" class="nav-parent"><span class="nav-parent-label"><span class="nav-icon">▤</span>식단 관리</span><span class="nav-caret" aria-hidden="true">›</span></button>
      <div class="nav-sub">
        <a class="nav-sub-link" href="menu-v2.html">주간 식단 관리</a>
        <a class="nav-sub-link" href="mealtime.html">식사 시간 관리</a>
      </div>
      <a class="nav-link" href="voc.html"><span class="nav-icon">◉</span>고객의견</a>
      <a class="nav-link" href="notice.html"><span class="nav-icon">▣</span>공지 관리</a>
    </div>
    <div class="nav-section"><span class="nav-label">환경 설정</span>
      <a class="nav-link" href="domain.html"><span class="nav-icon">@</span>인증 도메인 설정</a>
      <button type="button" class="nav-parent"><span class="nav-parent-label"><span class="nav-icon">◌</span>계정 관리</span><span class="nav-caret" aria-hidden="true">›</span></button>
      <div class="nav-sub">
        <a class="nav-sub-link" href="account.html">계정 관리</a>
        <a class="nav-sub-link" href="withdrawal.html">탈퇴 사유 통계</a>
      </div>
      <button type="button" class="nav-parent"><span class="nav-parent-label"><span class="nav-icon">◇</span>회사 관리</span><span class="nav-caret" aria-hidden="true">›</span></button>
      <div class="nav-sub">
        <a class="nav-sub-link active" href="site.html">사업장 관리</a>
        <a class="nav-sub-link" href="theme.html">테마 관리</a>
      </div>
      <a class="nav-link" href="manager.html"><span class="nav-icon">♙</span>운영자 관리</a>
    </div>
  </nav></aside>
  <main class="admin-shell"><div class="content">
    <section class="page-head"><div><h1>사업장 관리</h1></div></section>

    <label class="switch-row" style="margin-bottom:12px">
      <span class="switch"><input type="checkbox" id="siteMultiToggle" checked><span class="switch-track" aria-hidden="true"></span></span>
      사업장을 구분해서 운영
    </label>
    <p class="notice-help" id="siteMultiHelp" style="margin:0 0 20px"></p>

    <section class="panel">
      <div class="panel-head">
        <div><h2 class="panel-title">사업장 목록 <span class="accent" id="siteCount">3건</span></h2><p class="panel-sub" id="siteListSub"></p></div>
        <div class="panel-head-right"><button type="button" class="action-button primary" id="site-new">＋ 사업장 추가</button></div>
      </div>
      <div class="table-wrap"><table class="table site-table" id="siteTable"><thead><tr><th>기본</th><th>사업장명</th><th>사용</th><th></th></tr></thead><tbody>
        <tr data-page="1">
          <td><input type="radio" name="siteDefault" checked aria-label="본사를 기본 사업장으로 지정"></td>
          <td><button class="link-btn site-name-link" type="button" data-site-rename>본사</button></td>
          <td><label class="switch-row"><span class="switch"><input type="checkbox" class="site-use-toggle" checked><span class="switch-track" aria-hidden="true"></span></span></label></td>
          <td><button class="btn outline" type="button" data-site-delete>삭제</button></td>
        </tr>
        <tr data-page="1">
          <td><input type="radio" name="siteDefault" aria-label="여의도를 기본 사업장으로 지정"></td>
          <td><button class="link-btn site-name-link" type="button" data-site-rename>여의도</button></td>
          <td><label class="switch-row"><span class="switch"><input type="checkbox" class="site-use-toggle" checked><span class="switch-track" aria-hidden="true"></span></span></label></td>
          <td><button class="btn outline" type="button" data-site-delete>삭제</button></td>
        </tr>
        <tr data-page="1">
          <td><input type="radio" name="siteDefault" aria-label="홍대를 기본 사업장으로 지정"></td>
          <td><button class="link-btn site-name-link" type="button" data-site-rename>홍대</button></td>
          <td><label class="switch-row"><span class="switch"><input type="checkbox" class="site-use-toggle" checked><span class="switch-track" aria-hidden="true"></span></span></label></td>
          <td><button class="btn outline" type="button" data-site-delete>삭제</button></td>
        </tr>
      </tbody></table></div>
    </section>
  </div></main>

  <div class="scope-modal" id="siteDeleteModal" aria-hidden="true">
    <div class="scope-modal-backdrop"></div>
    <div class="scope-modal-body" role="dialog" aria-modal="true" aria-label="사업장 삭제 확인">
      <h2 class="scope-modal-title">사업장을 삭제하시겠습니까?</h2>
      <p class="scope-modal-desc" id="siteDeleteDesc"></p>
      <div class="scope-modal-actions">
        <button type="button" class="btn outline" data-site-delete-cancel>취소</button>
        <button type="button" class="btn primary" id="siteDeleteOk">삭제</button>
      </div>
    </div>
  </div>

  <div class="scope-modal" id="siteRenameModal" aria-hidden="true">
    <div class="scope-modal-backdrop"></div>
    <div class="scope-modal-body" role="dialog" aria-modal="true" aria-label="사업장명 수정">
      <h2 class="scope-modal-title">사업장명 수정</h2>
      <label class="scope-modal-label" for="siteRenameInput">사업장명</label>
      <input class="field scope-modal-field" type="text" id="siteRenameInput" aria-label="사업장명 수정">
      <span class="field-error" id="siteRenameError" hidden></span>
      <div class="scope-modal-actions">
        <button type="button" class="btn outline" data-site-rename-close>닫기</button>
        <button type="button" class="btn primary" id="siteRenameSaveBtn">저장</button>
      </div>
    </div>
  </div>

  <div class="voc-modal" id="siteModal" aria-hidden="true">
    <div class="voc-modal-backdrop"></div>
    <div class="voc-modal-body" role="dialog" aria-modal="true" aria-label="사업장 추가">
      <button type="button" class="lightbox-close" data-site-modal-close aria-label="닫기">✕</button>
      <h3 class="voc-modal-answer-title" style="margin-bottom:16px">사업장 추가</h3>
      <div class="notice-form">
        <label class="notice-field">사업장명
          <input class="field" type="text" id="siteNameInput" placeholder="예: 강남">
          <span class="field-error" id="siteNameError" hidden></span>
        </label>
      </div>
      <div class="notice-modal-actions">
        <button class="btn outline" type="button" data-site-modal-close>취소</button>
        <button class="btn primary" type="button" id="siteSubmitBtn">등록</button>
      </div>
    </div>
  </div>

  <div class="scope-modal" id="scopeModal" aria-hidden="true">
    <div class="scope-modal-backdrop"></div>
    <div class="scope-modal-body" role="dialog" aria-modal="true" aria-label="조회 기업 변경">
      <h2 class="scope-modal-title">조회 기업 변경</h2>
      <label class="scope-modal-label" for="scopeCompany">기업</label>
      <select class="field scope-modal-field" id="scopeCompany"><option value="현대캐피탈">현대캐피탈</option></select>
      <div class="scope-modal-actions">
        <button type="button" class="btn outline" data-scope-close>취소</button>
        <button type="button" class="btn primary" id="scopeConfirm">변경</button>
      </div>
    </div>
  </div>
  <div class="toast" role="status">✓ <span></span></div>
  <script src="resources/js/admin-common.js"></script>
  <script src="resources/js/site.js"></script>
</body>
</html>
