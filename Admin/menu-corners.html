<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>해비치 급식 App 관리자 - 코너 관리</title>
  <link rel="stylesheet" href="resources/css/reset.css">
  <link rel="stylesheet" href="resources/css/admin.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="dashboard.html"><span class="brand-mark">H</span>해비치 급식 App <em>관리자</em></a>
    <div class="profile">
      <button type="button" class="scope-trigger" id="scopeTrigger" aria-haspopup="dialog"><span id="scopeLabel">현대캐피탈 · 본사</span><span class="scope-caret" aria-hidden="true">▾</span></button>
      <span class="avatar">정H</span><strong>정혜림 관리자</strong>
    </div>
  </header>
  <aside class="sidenav" aria-label="관리자 메뉴"><nav>
    <div class="nav-section"><span class="nav-label">운영</span>
      <a class="nav-link" href="dashboard.html"><span class="nav-icon">▦</span>대시보드</a>
      <div class="nav-parent"><span class="nav-icon">▤</span>식단 관리</div>
      <div class="nav-sub">
        <a class="nav-sub-link" href="menu.html">주간 식단 관리</a>
        <a class="nav-sub-link active" href="menu-corners.html">코너 관리</a>
      </div>
      <a class="nav-link" href="voc.html"><span class="nav-icon">◉</span>고객의견</a>
      <a class="nav-link" href="notice.html"><span class="nav-icon">▣</span>공지 관리</a>
    </div>
    <div class="nav-section"><span class="nav-label">환경 설정</span>
      <a class="nav-link" href="domain.html"><span class="nav-icon">@</span>인증 도메인 설정</a>
      <a class="nav-link" href="#" data-demo="계정 관리 화면은 다음 작업에서 연결합니다."><span class="nav-icon">◌</span>계정 관리</a>
      <a class="nav-link" href="#" data-demo="사업장·테마 관리 화면은 다음 작업에서 연결합니다."><span class="nav-icon">◇</span>사업장·테마 관리</a>
      <a class="nav-link" href="#" data-demo="관리자 계정·권한 화면은 다음 작업에서 연결합니다."><span class="nav-icon">♙</span>관리자 계정·권한</a>
    </div>
  </nav></aside>
  <main class="admin-shell"><div class="content">
    <section class="page-head"><div><h1>코너 관리</h1></div></section>
    <div class="menu-toolbar">
      <label class="switch-row">
        <span class="switch"><input type="checkbox" id="corner-use-toggle" checked><span class="switch-track" aria-hidden="true"></span></span>
        코너 사용
      </label>
    </div>
    <section class="panel">
      <div class="panel-head"><div><h2 class="panel-title">코너 목록</h2><p class="panel-sub">사업장별로 5개 슬롯(코너A~코너E)이 기본 제공되며, 코너명을 수정한 뒤 저장을 눌러주세요.</p></div></div>
      <div class="table-wrap"><table class="table corner-table"><thead><tr><th>순서</th><th>코너명</th><th>최근 수정일</th></tr></thead><tbody>
        <tr data-corner-row>
          <td>1</td>
          <td><input class="field corner-input" type="text" value="코너A" maxlength="10" aria-label="코너 1 이름"></td>
          <td>2026.08.28</td>
        </tr>
        <tr data-corner-row>
          <td>2</td>
          <td><input class="field corner-input" type="text" value="코너B" maxlength="10" aria-label="코너 2 이름"></td>
          <td>2026.08.28</td>
        </tr>
        <tr data-corner-row>
          <td>3</td>
          <td><input class="field corner-input" type="text" value="코너C" maxlength="10" aria-label="코너 3 이름"></td>
          <td>-</td>
        </tr>
        <tr data-corner-row>
          <td>4</td>
          <td><input class="field corner-input" type="text" value="코너D" maxlength="10" aria-label="코너 4 이름"></td>
          <td>-</td>
        </tr>
        <tr data-corner-row>
          <td>5</td>
          <td><input class="field corner-input" type="text" value="코너E" maxlength="10" aria-label="코너 5 이름"></td>
          <td>-</td>
        </tr>
      </tbody></table></div>
      <div class="corner-actions">
        <button class="action-button primary" type="button" id="corner-save">저장</button>
      </div>
    </section>
  </div></main>
  <div class="scope-modal" id="scopeModal" aria-hidden="true">
    <div class="scope-modal-backdrop" data-scope-close></div>
    <div class="scope-modal-body" role="dialog" aria-modal="true" aria-label="조회 사업장 변경">
      <h2 class="scope-modal-title">조회 범위 변경</h2>
      <label class="scope-modal-label" for="scopeCompany">기업</label>
      <select class="field scope-modal-field" id="scopeCompany"><option value="현대캐피탈">현대캐피탈</option></select>
      <span class="scope-modal-label">사업장</span>
      <div class="scope-modal-list" id="scopeSiteList" role="radiogroup" aria-label="사업장 선택"></div>
      <div class="scope-modal-actions">
        <button type="button" class="btn outline" data-scope-close>취소</button>
        <button type="button" class="btn primary" id="scopeConfirm">변경</button>
      </div>
    </div>
  </div>
  <div class="toast" role="status">✓ <span></span></div>
  <script src="resources/js/admin-common.js"></script>
  <script src="resources/js/menu-corners.js"></script>
</body>
</html>
