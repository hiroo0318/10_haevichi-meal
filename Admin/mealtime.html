<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>해비치 급식 App 관리자 - 식사 시간 관리</title>
  <link rel="stylesheet" href="resources/css/reset.css">
  <link rel="stylesheet" href="resources/css/admin.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="dashboard.html"><span class="brand-mark">H</span>해비치 급식 App <em>관리자</em></a>
    <div class="profile">
      <button type="button" class="scope-trigger" id="scopeTrigger" aria-haspopup="dialog"><span id="scopeLabel">현대캐피탈</span><span class="scope-caret" aria-hidden="true">▾</span></button>
      <span class="avatar">정H</span><strong>정혜림 관리자</strong>
    </div>
  </header>
  <aside class="sidenav" aria-label="관리자 메뉴"><nav>
    <div class="nav-section"><span class="nav-label">운영</span>
      <a class="nav-link" href="dashboard.html"><span class="nav-icon">▦</span>대시보드</a>
      <div class="nav-parent"><span class="nav-icon">▤</span>식단 관리</div>
      <div class="nav-sub">
        <a class="nav-sub-link" href="menu.html">주간 식단 관리</a>
        <a class="nav-sub-link active" href="mealtime.html">식사 시간 관리</a>
      </div>
      <a class="nav-link" href="voc.html"><span class="nav-icon">◉</span>고객의견</a>
      <a class="nav-link" href="notice.html"><span class="nav-icon">▣</span>공지 관리</a>
    </div>
    <div class="nav-section"><span class="nav-label">환경 설정</span>
      <a class="nav-link" href="domain.html"><span class="nav-icon">@</span>인증 도메인 설정</a>
      <div class="nav-parent"><span class="nav-icon">◌</span>계정 관리</div>
      <div class="nav-sub">
        <a class="nav-sub-link" href="account.html">계정 관리</a>
        <a class="nav-sub-link" href="withdrawal.html">탈퇴 사유 통계</a>
      </div>
      <div class="nav-parent"><span class="nav-icon">◇</span>사업장·테마 관리</div>
      <div class="nav-sub">
        <a class="nav-sub-link" href="site.html">사업장 관리</a>
        <a class="nav-sub-link" href="theme.html">테마 관리</a>
      </div>
      <a class="nav-link" href="#" data-demo="운영자 관리 화면은 다음 작업에서 연결합니다."><span class="nav-icon">♙</span>운영자 관리</a>
    </div>
  </nav></aside>
  <main class="admin-shell"><div class="content">
    <section class="page-head"><div><h1>식사 시간 관리</h1></div></section>

    <div class="menu-toolbar">
      <select class="field" aria-label="사업장 선택"><option>본사</option><option>여의도</option><option>홍대</option></select>
    </div>

    <section class="panel">
      <div class="panel-head"><div><h2 class="panel-title">운영 시간</h2><p class="panel-sub">사업장별 조식·중식·석식 운영 시간을 고정 관리합니다.</p></div></div>
      <div class="table-wrap"><table class="table mealtime-table"><thead><tr><th>식사구분</th><th>시작 시간</th><th>종료 시간</th></tr></thead><tbody>
        <tr>
          <td>조식</td>
          <td><input class="field" type="time" value="07:30" aria-label="조식 시작 시간"></td>
          <td><input class="field" type="time" value="09:00" aria-label="조식 종료 시간"></td>
        </tr>
        <tr>
          <td>중식</td>
          <td><input class="field" type="time" value="11:30" aria-label="중식 시작 시간"></td>
          <td><input class="field" type="time" value="13:30" aria-label="중식 종료 시간"></td>
        </tr>
        <tr>
          <td>석식</td>
          <td><input class="field" type="time" value="17:30" aria-label="석식 시작 시간"></td>
          <td><input class="field" type="time" value="19:00" aria-label="석식 종료 시간"></td>
        </tr>
      </tbody></table></div>
      <div class="corner-actions">
        <button class="action-button primary" type="button" id="mealtime-save">저장</button>
      </div>
    </section>
  </div></main>

  <div class="scope-modal" id="scopeModal" aria-hidden="true">
    <div class="scope-modal-backdrop" data-scope-close></div>
    <div class="scope-modal-body" role="dialog" aria-modal="true" aria-label="조회 기업 변경">
      <h2 class="scope-modal-title">조회 기업 변경</h2>
      <label class="scope-modal-label" for="scopeCompany">기업</label>
      <select class="field scope-modal-field" id="scopeCompany"><option value="현대캐피탈">현대캐피탈</option></select>
      <div class="scope-modal-actions">
        <button type="button" class="btn outline" data-scope-close>취소</button>
        <button type="button" class="btn primary" id="scopeConfirm">변경</button>
      </div>
    </div>
  </div>
  <div class="toast" role="status">✓ <span></span></div>
  <script src="resources/js/admin-common.js"></script>
  <script src="resources/js/mealtime.js"></script>
</body>
</html>
