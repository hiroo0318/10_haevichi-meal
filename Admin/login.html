<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>해비치 급식 App 관리자 - 로그인</title>
  <link rel="stylesheet" href="resources/css/reset.css">
  <link rel="stylesheet" href="resources/css/admin.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="login-brand">
        <span class="brand-mark">H</span>
        <h1>해비치 급식 App <em style="font-style:normal;color:var(--admin-blue)">관리자</em></h1>
        <span>관리자 계정으로 로그인해주세요</span>
      </div>
      <form class="login-form" id="loginForm" novalidate>
        <label>관리자 ID
          <input class="field" type="text" id="loginId" placeholder="관리자 ID를 입력해주세요" autocomplete="username">
          <span class="field-error" id="loginIdError" hidden></span>
        </label>
        <label>비밀번호
          <input class="field" type="password" id="loginPw" placeholder="비밀번호를 입력해주세요" autocomplete="current-password">
          <span class="field-error" id="loginPwError" hidden></span>
        </label>
        <button class="btn primary" type="submit">로그인</button>
      </form>
    </section>
  </main>
  <div class="toast" role="status">✓ <span></span></div>
  <script src="resources/js/admin-common.js"></script>
  <script src="resources/js/login.js"></script>
</body>
</html>
