<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>비밀번호 변경 | 해비치 Food Service</title><link rel="stylesheet" href="../../resources/css/reset.css"><link rel="stylesheet" href="../../resources/css/theme-haevichi.css"><link rel="stylesheet" href="../../resources/css/service-v2.css"></head><body class="meal-v2-body"><div class="meal-v2-app"><header class="meal-v2-detail-head"><a href="my.html" aria-label="My로 돌아가기"><img src="../../resources/images/icon/ic-back.svg" alt=""></a><h1>비밀번호 변경</h1></header><main class="service-v2-sub-content"><form id="serviceV2PasswordForm" class="service-v2-form" novalidate><section data-v2-password-step="1"><p class="service-v2-step">1 / 2</p><h2>현재 비밀번호를<br>입력해주세요</h2><p class="service-v2-description">안전한 변경을 위해 현재 비밀번호를 확인해요.</p><label>현재 비밀번호<input id="serviceV2CurrentPassword" type="password" placeholder="비밀번호 입력" autocomplete="current-password"></label><p class="service-v2-form-error" id="serviceV2CurrentPasswordError" hidden>현재 비밀번호를 입력해주세요.</p><button type="button" data-v2-password-verify>확인</button></section><section data-v2-password-step="2" hidden><p class="service-v2-step">2 / 2</p><h2>새 비밀번호를<br>등록해주세요</h2><p class="service-v2-description">로그인할 때 사용할 새 비밀번호를 설정해 주세요.</p><label>새 비밀번호<input id="serviceV2NewPassword" type="password" placeholder="8자 이상 입력" autocomplete="new-password"></label><p class="service-v2-form-error" id="serviceV2NewPasswordLengthError" hidden>비밀번호를 8자 이상 입력해주세요.</p><label>새 비밀번호 확인<input id="serviceV2NewPasswordConfirm" type="password" placeholder="비밀번호를 다시 입력" autocomplete="new-password"></label><p class="service-v2-form-error" id="serviceV2NewPasswordError" hidden>비밀번호가 일치하지 않습니다.</p><button type="submit">변경 완료</button><button class="service-v2-text-button" type="button" data-v2-password-back>← 이전 단계로 돌아가기</button></section></form></main></div><script src="../../resources/js/service-v2.js"></script></body></html>
