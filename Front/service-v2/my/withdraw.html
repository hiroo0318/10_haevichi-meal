<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>회원 탈퇴 | 해비치 Food Service</title><link rel="stylesheet" href="../../resources/css/reset.css"><link rel="stylesheet" href="../../resources/css/theme-haevichi.css"><link rel="stylesheet" href="../../resources/css/service-v2.css"></head><body class="meal-v2-body"><div class="meal-v2-app"><header class="meal-v2-detail-head"><a href="my.html" aria-label="My로 돌아가기"><img src="../../resources/images/icon/ic-back.svg" alt=""></a><h1>회원 탈퇴</h1></header><main class="service-v2-sub-content"><form id="serviceV2WithdrawForm" class="service-v2-form" novalidate><h2>정말 탈퇴하시겠어요?</h2><p class="service-v2-description">탈퇴하면 계정과 서비스 이용 기록을 복구할 수 없어요.</p><section class="service-v2-info-card service-v2-info-card--danger"><h3>탈퇴 전 확인해주세요</h3><ul><li>작성한 의견과 서비스 이용 기록이 삭제됩니다.</li><li>동일한 메일 주소로 재가입 가능 여부는 운영 정책에 따라 달라질 수 있습니다.</li></ul></section><label>비밀번호 확인<input id="serviceV2WithdrawPassword" type="password" placeholder="비밀번호 입력" autocomplete="current-password"></label><p class="service-v2-form-error" id="serviceV2WithdrawPasswordError" hidden>비밀번호를 입력해주세요.</p><label>탈퇴 사유 <small>선택</small><select id="serviceV2WithdrawReason"><option value="">탈퇴 사유를 선택해주세요</option><option value="low-use">이용 빈도가 낮아요</option><option value="menu-info">메뉴 정보가 부족해요</option><option value="inconvenience">서비스가 불편해요</option><option value="other">기타</option></select></label><textarea id="serviceV2WithdrawOther" placeholder="탈퇴 사유를 입력해주세요" maxlength="300" hidden></textarea><label class="service-v2-check"><input id="serviceV2WithdrawAgree" type="checkbox"><span>탈퇴 시 계정과 이용 기록이 삭제되며 복구할 수 없음을 확인했습니다.</span></label><p class="service-v2-form-error" id="serviceV2WithdrawAgreeError" hidden>탈퇴 유의사항을 확인해주세요.</p><button class="is-danger" type="submit">회원 탈퇴</button></form></main></div><script src="../../resources/js/service-v2.js"></script></body></html>
