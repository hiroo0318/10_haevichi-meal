<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>회원가입 | 해비치 급식 App</title>
<link rel="stylesheet" href="resources/css/reset.css">
<link rel="stylesheet" href="resources/css/style.css">
</head>
<body>
<!-- HVM-MO-02-00 회원가입: 사내 메일 확인 → 메일 인증 → 비밀번호 등록 -->
<div class="page">
  <main class="content signup-content">
    <div class="signup-brand">FX<span>By Haevichi</span></div>

    <form id="signupForm" novalidate>
      <div class="signup-progress" aria-label="회원가입 진행 단계">
        <span class="is-active" data-signup-progress="1">1</span><i></i>
        <span data-signup-progress="2">2</span><i></i>
        <span data-signup-progress="3">3</span>
      </div>

      <section class="signup-step" data-signup-step="1">
        <p class="signup-step-count">1 / 3</p>
        <h1>사내 메일 주소를<br>입력해주세요</h1>
        <p class="signup-description">소속 회사의 사내 메일 주소만 가입할 수 있어요.</p>
        <div class="field signup-field">
          <label for="signupEmail">사내 메일 주소</label>
          <input class="input" id="signupEmail" type="email" placeholder="name@hyundaicapital.com" autocomplete="email" inputmode="email" required>
          <p class="form-message is-error" id="signupEmailError" hidden>허용되지 않은 메일 도메인입니다. 소속 회사의 사내 메일 주소로 다시 시도해주세요.</p>
        </div>
        <button class="btn btn-primary" type="button" data-signup-next="email">다음</button>
      </section>

      <section class="signup-step" data-signup-step="2" hidden>
        <p class="signup-step-count">2 / 3</p>
        <h1>메일 인증</h1>
        <p class="signup-description"><b id="signupEmailDisplay"></b>로<br>인증번호를 보냈어요.</p>
        <div class="field signup-field">
          <label for="signupCode">인증번호</label>
          <div class="verify-field">
            <input class="input" id="signupCode" type="text" placeholder="인증번호 6자리" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
            <button class="btn-resend" id="signupResend" type="button">재발송</button>
          </div>
          <p class="form-message" id="signupCodeGuide">인증번호는 10분 동안 유효합니다.</p>
          <p class="form-message is-error" id="signupCodeError" hidden>인증번호를 다시 확인해주세요.</p>
        </div>
        <button class="btn btn-primary" type="button" data-signup-next="verify">확인</button>
      </section>

      <section class="signup-step" data-signup-step="3" hidden>
        <p class="signup-step-count">3 / 3</p>
        <h1>비밀번호를<br>등록해주세요</h1>
        <p class="signup-description">로그인할 때 사용할 비밀번호를 설정해 주세요.</p>
        <div class="field signup-field">
          <label for="signupPassword">비밀번호</label>
          <input class="input" id="signupPassword" type="password" placeholder="8자 이상 입력" autocomplete="new-password" required>
          <p class="form-message is-error" id="signupPasswordLengthError" hidden>비밀번호를 8자 이상 입력해주세요.</p>
        </div>
        <div class="field signup-field">
          <label for="signupPasswordConfirm">비밀번호 확인</label>
          <input class="input" id="signupPasswordConfirm" type="password" placeholder="비밀번호를 다시 입력" autocomplete="new-password" required>
          <p class="form-message is-error" id="signupPasswordError" hidden>비밀번호가 일치하지 않습니다.</p>
        </div>
        <button class="btn btn-primary" type="submit">가입 완료</button>
      </section>
    </form>

    <button class="signup-step-back" id="signupBack" type="button"><span aria-hidden="true">←</span> <span id="signupBackLabel">로그인으로 돌아가기</span></button>
  </main>
</div>
<script src="resources/js/auth.js"></script>
</body>
</html>
