<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>의견 쓰기(VOC) | 해비치 급식 App</title>
<link rel="stylesheet" href="resources/css/reset.css">
<link rel="stylesheet" href="resources/css/style.css">
<link rel="stylesheet" href="resources/css/theme-haevichi.css" id="themeLink">
</head>
<body>
<!-- HVM-MO-07-00 나의 의견 작성 -->
<div class="page">

  <header class="topbar">
    <div class="brand">FX<span>By Haevichi</span></div>
  </header>

  <main class="content voc-content">
    <div class="voc-body">
      <div class="page-title"><h1>의견을 들려주세요</h1></div>
      <nav class="voc-tabs" aria-label="나의 의견 메뉴">
        <a class="voc-tab is-active" aria-current="page" href="voc.html">접수</a>
        <a class="voc-tab" href="voc-list.html">내역</a>
      </nav>
      <section class="voc-panel">
        <form class="voc-form" id="vocForm">
          <fieldset class="voc-field voc-category"><legend>어떤 의견인가요?</legend><div class="voc-category-list" id="vocCategoryList"><button type="button" class="voc-category-chip is-active" data-voc-category="맛/메뉴">맛/메뉴</button><button type="button" class="voc-category-chip" data-voc-category="위생">위생</button><button type="button" class="voc-category-chip" data-voc-category="서비스/친절도">서비스</button><button type="button" class="voc-category-chip" data-voc-category="시설/환경">시설/환경</button><button type="button" class="voc-category-chip" data-voc-category="APP 사용 경험">앱 사용</button><button type="button" class="voc-category-chip" data-voc-category="제안">제안</button><button type="button" class="voc-category-chip" data-voc-category="기타">기타</button></div><select id="vocType" class="visually-hidden" required><option>맛/메뉴</option><option>위생</option><option>서비스/친절도</option><option>시설/환경</option><option>APP 사용 경험</option><option>제안</option><option>기타</option></select></fieldset>
          <div class="voc-field"><label for="vocMessage">의견을 들려주세요 <em>필수</em></label><textarea id="vocMessage" class="voc-textarea" maxlength="500" placeholder="불편사항이나 제안을 입력해주세요&#10;&#10;메뉴명이나 상황을 함께 알려주시면 더 빠르게 확인할 수 있어요." required></textarea><div class="voc-field-meta"><p class="voc-help">급식 메뉴 또는 서비스 이용에 대한 의견을 남겨주세요.</p><span id="vocCharCount">0 / 500</span></div></div>
          <div class="voc-field"><label for="vocFiles">사진을 함께 보낼까요? <span>선택 · 최대 3장</span></label><input id="vocFiles" class="visually-hidden" type="file" accept="image/*" multiple><div class="voc-upload-list" id="vocPreviewList"><label class="voc-upload" for="vocFiles"><b>＋</b><span>사진 추가</span></label></div><p class="voc-file-count" id="vocFileCount">사진을 첨부하면 더 정확하게 확인할 수 있어요.</p></div>
          <div class="voc-submit-wrap"><p>제출 후 내역에서 처리 상태를 확인할 수 있어요.</p><button type="submit" class="btn btn-primary">의견 제출하기</button></div>
        </form>
      </section>
    </div>
  </main>

  <section class="app-alert" id="vocSuccessAlert" role="dialog" aria-modal="true" aria-labelledby="vocSuccessTitle" hidden>
    <div class="app-alert-card app-alert-card--success">
      <span class="app-alert-symbol" aria-hidden="true">✓</span>
      <h2 id="vocSuccessTitle">의견이 접수되었습니다</h2>
      <p>더 나은 식사 경험을 제공할 수 있도록 하겠습니다.</p>
      <div class="app-alert-actions app-alert-actions--single">
        <button type="button" class="app-alert-confirm" id="vocSuccessConfirm">확인</button>
      </div>
    </div>
  </section>

  <nav class="tabbar">
    <a href="home.html"><span class="icon" style="--icon:url(../images/icon/ic-home.svg)" aria-hidden="true"></span>홈</a>
    <a class="active" href="voc.html"><span class="icon" style="--icon:url(../images/icon/ic-voc.svg)" aria-hidden="true"></span>나의 의견</a>
    <a href="notice.html"><span class="icon" style="--icon:url(../images/icon/ic-notice.svg)" aria-hidden="true"></span>공지</a>
    <a href="my.html"><span class="icon" style="--icon:url(../images/icon/ic-my.svg)" aria-hidden="true"></span>My</a>
  </nav>

</div>
<script src="resources/js/common.js"></script>
</body>
</html>
