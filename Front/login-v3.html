<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>로그인 | 인증 화면 V3</title><link rel="stylesheet" href="resources/css/reset.css"><link rel="stylesheet" href="resources/css/auth-v3.css"></head>
<body data-auth-version="v3"><div class="auth-v3-page"><main class="auth-v3-content"><section class="v3-auth-hero"><div class="auth-v3-photo" aria-hidden="true"></div><div class="auth-v3-brand"><b>FX</b><span>By Haevichi</span></div><div class="v3-auth-hero-copy"><p>WELCOME TO MEAL APP</p><h1>오늘의 식사를<br>확인해 보세요</h1><span>매일의 식사 경험을 더 편리하게 만나보세요.</span></div></section><section class="v3-auth-card"><h2>로그인</h2><p>사내 메일 주소로 간편하게 로그인하세요.</p><form id="loginForm" novalidate><div class="v3-field"><label for="email">사내 메일 주소</label><input class="v3-input" id="email" type="email" placeholder="name@company.com" autocomplete="username" required></div><div class="v3-field"><label for="pw">비밀번호</label><input class="v3-input" id="pw" type="password" placeholder="비밀번호를 입력해주세요" autocomplete="current-password" required></div><div class="v3-error" id="loginErr" hidden>이메일 또는 비밀번호가 일치하지 않습니다.</div><div class="v3-login-row"><label class="v3-check"><input type="checkbox" id="autoLogin" checked><span>자동로그인</span></label><a href="#">아이디/비밀번호 찾기</a></div><button type="submit" class="v3-primary">로그인</button></form><p class="v3-card-footer">처음 이용하시나요?<a href="signup-v3.html">회원가입</a></p><p class="v3-hint">데모용: 비밀번호에 <b>0000</b>을 입력하면 실패 사례를 확인할 수 있습니다.</p></section></main></div><script src="resources/js/common.js"></script></body></html>
