<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>회원가입 | 인증 화면 V3</title><link rel="stylesheet" href="resources/css/reset.css"><link rel="stylesheet" href="resources/css/auth-v3.css"></head>
<body data-auth-version="v3"><div class="auth-v3-page"><main class="auth-v3-content"><section class="v3-auth-hero v3-signup-hero"><div class="auth-v3-photo" aria-hidden="true"></div><div class="auth-v3-brand"><b>FX</b><span>By Haevichi</span></div><div class="v3-auth-hero-copy"><p>JOIN HAEVICHI MEAL APP</p><h1>식사 경험을 위한<br>간단한 가입 절차</h1></div></section><section class="v3-auth-card v3-signup-card"><form id="signupForm" data-signup-version="v3" novalidate><div class="v3-progress" aria-label="회원가입 진행 단계"><span class="is-active" data-signup-progress="1">1</span><i></i><span data-signup-progress="2">2</span><i></i><span data-signup-progress="3">3</span></div><section class="v3-step" data-signup-step="1"><p class="v3-step-count">STEP 1</p><h2>사내 메일 주소를<br>입력해주세요</h2><p class="v3-description">소속 회사의 사내 메일 주소만 가입할 수 있어요.</p><div class="v3-field"><label for="signupEmail">사내 메일 주소</label><input class="v3-input" id="signupEmail" type="email" placeholder="name@company.com" autocomplete="email" inputmode="email" required><p class="v3-message is-error" id="signupEmailError" hidden>허용되지 않은 메일 도메인입니다.</p></div><button class="v3-primary" type="button" data-signup-next="email">다음</button></section><section class="v3-step" data-signup-step="2" hidden><p class="v3-step-count">STEP 2</p><h2>메일 인증</h2><p class="v3-description"><b id="signupEmailDisplay"></b>로<br>인증번호를 보냈어요.</p><div class="v3-field"><label for="signupCode">인증번호</label><div class="v3-verify"><input class="v3-input" id="signupCode" type="text" placeholder="인증번호 6자리" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button class="v3-resend" id="signupResend" type="button">재발송</button></div><p class="v3-message" id="signupCodeGuide">인증번호는 10분 동안 유효합니다.</p><p class="v3-message is-error" id="signupCodeError" hidden>인증번호를 다시 확인해주세요.</p></div><button class="v3-primary" type="button" data-signup-next="verify">확인</button></section><section class="v3-step" data-signup-step="3" hidden><p class="v3-step-count">STEP 3</p><h2>비밀번호를<br>등록해주세요</h2><p class="v3-description">로그인할 때 사용할 비밀번호를 설정해 주세요.</p><div class="v3-field"><label for="signupPassword">비밀번호</label><input class="v3-input" id="signupPassword" type="password" placeholder="8자 이상 입력" autocomplete="new-password" required><p class="v3-message is-error" id="signupPasswordLengthError" hidden>비밀번호를 8자 이상 입력해주세요.</p></div><div class="v3-field"><label for="signupPasswordConfirm">비밀번호 확인</label><input class="v3-input" id="signupPasswordConfirm" type="password" placeholder="비밀번호를 다시 입력" autocomplete="new-password" required><p class="v3-message is-error" id="signupPasswordError" hidden>비밀번호가 일치하지 않습니다.</p></div><button class="v3-primary" type="submit">가입 완료</button></section></form><button class="v3-back" id="signupBack" type="button"><span aria-hidden="true">←</span><span id="signupBackLabel">로그인으로 돌아가기</span></button></section></main></div><script src="resources/js/common.js"></script></body></html>
