<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>비밀번호 재설정 | 해비치 급식 App</title>
<link rel="stylesheet" href="resources/css/reset.css">
<link rel="stylesheet" href="resources/css/style.css">
</head>
<body>
<div class="page">
  <main class="content password-reset-content">
    <div class="password-reset-brand">FX<span>By Haevichi</span></div>
    <form id="passwordResetForm" data-password-reset-version="v1" novalidate>
      <section class="password-reset-step" data-password-reset-step="1">
        <p class="password-step-count">1 / 3</p>
        <h1>비밀번호를<br>재설정할까요?</h1>
        <p class="password-description">가입한 사내 메일 주소로 인증번호를 보내드릴게요.</p>
        <div class="field signup-field"><label for="resetEmail">사내 메일 주소</label><input class="input" id="resetEmail" type="email" placeholder="name@company.com" autocomplete="email" required><p class="form-message is-error" id="resetEmailError" hidden>사내 메일 주소를 확인해주세요.</p></div>
        <button class="btn btn-primary" type="button" data-password-reset-next="email">인증번호 받기</button>
      </section>
      <section class="password-reset-step" data-password-reset-step="2" hidden>
        <p class="password-step-count">2 / 3</p>
        <h1>메일 인증을<br>완료해주세요</h1>
        <p class="password-description"><b id="resetEmailDisplay"></b>로 인증번호를 보냈어요.</p>
        <div class="field signup-field"><label for="resetCode">인증번호</label><div class="verify-field"><input class="input" id="resetCode" type="text" placeholder="인증번호 6자리" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button class="btn-resend" id="resetResend" type="button">재발송</button></div><p class="form-message is-error" id="resetCodeError" hidden>인증번호를 다시 확인해주세요.</p></div>
        <button class="btn btn-primary" type="button" data-password-reset-next="verify">확인</button>
      </section>
      <section class="password-reset-step" data-password-reset-step="3" hidden>
        <p class="password-step-count">3 / 3</p>
        <h1>새 비밀번호를<br>등록해주세요</h1>
        <p class="password-description">로그인할 때 사용할 새 비밀번호를 설정해 주세요.</p>
        <div class="field signup-field"><label for="resetPassword">새 비밀번호</label><input class="input" id="resetPassword" type="password" placeholder="8자 이상 입력" autocomplete="new-password" required><p class="form-message is-error" id="resetPasswordLengthError" hidden>비밀번호를 8자 이상 입력해주세요.</p></div>
        <div class="field signup-field"><label for="resetPasswordConfirm">새 비밀번호 확인</label><input class="input" id="resetPasswordConfirm" type="password" placeholder="비밀번호를 다시 입력" autocomplete="new-password" required><p class="form-message is-error" id="resetPasswordError" hidden>비밀번호가 일치하지 않습니다.</p></div>
        <button class="btn btn-primary" type="submit">비밀번호 재설정</button>
      </section>
    </form>
    <a class="password-reset-back" id="passwordResetBack" href="login.html">← <span>로그인으로 돌아가기</span></a>
  </main>
</div>
<script src="resources/js/common.js"></script>
</body>
</html>
