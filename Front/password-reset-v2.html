<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>비밀번호 재설정 | 인증 화면 V2</title>
<link rel="stylesheet" href="resources/css/reset.css"><link rel="stylesheet" href="resources/css/auth-v2.css">
</head><body data-auth-version="v2">
<div class="auth-v2-page"><main class="auth-v2-content">
  <section class="auth-v2-hero password-reset-v2-hero"><div class="auth-v2-brand"><b>FX</b><span>By Haevichi</span></div><h1>안전하게<br>비밀번호를 재설정하세요</h1><p>사내 메일 인증 후 새 비밀번호를 등록할 수 있어요.</p></section>
  <section class="auth-v2-card password-reset-v2-card">
    <form id="passwordResetForm" data-password-reset-version="v2" novalidate>
      <section class="password-reset-v2-step" data-password-reset-step="1"><p class="password-reset-v2-count">STEP 1</p><h2>사내 메일 주소를<br>입력해주세요</h2><p class="password-reset-v2-description">인증번호를 보내드릴게요.</p><div class="auth-v2-field"><label for="resetEmail">사내 메일 주소</label><input class="auth-v2-input" id="resetEmail" type="email" placeholder="name@company.com" autocomplete="email" required><p class="auth-v2-message is-error" id="resetEmailError" hidden>사내 메일 주소를 확인해주세요.</p></div><button class="auth-v2-primary" type="button" data-password-reset-next="email">인증번호 받기</button></section>
      <section class="password-reset-v2-step" data-password-reset-step="2" hidden><p class="password-reset-v2-count">STEP 2</p><h2>메일 인증을<br>완료해주세요</h2><p class="password-reset-v2-description"><b id="resetEmailDisplay"></b>로 인증번호를 보냈어요.</p><div class="auth-v2-field"><label for="resetCode">인증번호</label><div class="auth-v2-verify"><input class="auth-v2-input" id="resetCode" type="text" placeholder="인증번호 6자리" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button class="auth-v2-resend" id="resetResend" type="button">재발송</button></div><p class="auth-v2-message is-error" id="resetCodeError" hidden>인증번호를 다시 확인해주세요.</p></div><button class="auth-v2-primary" type="button" data-password-reset-next="verify">확인</button></section>
      <section class="password-reset-v2-step" data-password-reset-step="3" hidden><p class="password-reset-v2-count">STEP 3</p><h2>새 비밀번호를<br>등록해주세요</h2><p class="password-reset-v2-description">로그인할 때 사용할 새 비밀번호를 설정해 주세요.</p><div class="auth-v2-field"><label for="resetPassword">새 비밀번호</label><input class="auth-v2-input" id="resetPassword" type="password" placeholder="8자 이상 입력" autocomplete="new-password" required><p class="auth-v2-message is-error" id="resetPasswordLengthError" hidden>비밀번호를 8자 이상 입력해주세요.</p></div><div class="auth-v2-field"><label for="resetPasswordConfirm">새 비밀번호 확인</label><input class="auth-v2-input" id="resetPasswordConfirm" type="password" placeholder="비밀번호를 다시 입력" autocomplete="new-password" required><p class="auth-v2-message is-error" id="resetPasswordError" hidden>비밀번호가 일치하지 않습니다.</p></div><button class="auth-v2-primary" type="submit">비밀번호 재설정</button></section>
    </form>
    <a class="auth-v2-back" id="passwordResetBack" href="login-v2.html"><span aria-hidden="true">←</span><span>로그인으로 돌아가기</span></a>
  </section>
</main></div><script src="resources/js/common.js"></script>
</body></html>
