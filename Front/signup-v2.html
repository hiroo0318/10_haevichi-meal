<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>회원가입 | 인증 화면 V2</title>
<link rel="stylesheet" href="resources/css/reset.css"><link rel="stylesheet" href="resources/css/auth-v2.css">
</head><body data-auth-version="v2">
<div class="auth-v2-page"><main class="auth-v2-content">
  <section class="auth-v2-hero signup-v2-hero"><div class="auth-v2-brand"><b>FX</b><span>By Haevichi</span></div><h1>서비스 이용을 위한<br>간단한 가입 절차</h1><p>사내 메일 인증 후 바로 이용할 수 있어요.</p></section>
  <section class="auth-v2-card signup-v2-card">
    <form id="signupForm" data-signup-version="v2" novalidate>
      <div class="signup-v2-progress" aria-label="회원가입 진행 단계"><span class="is-active" data-signup-progress="1">1</span><i></i><span data-signup-progress="2">2</span><i></i><span data-signup-progress="3">3</span></div>
      <section class="signup-v2-step" data-signup-step="1"><p class="signup-v2-step-count">STEP 1</p><h2>사내 메일 주소를<br>입력해주세요</h2><p class="signup-v2-description">소속 회사의 사내 메일 주소만 가입할 수 있어요.</p><div class="auth-v2-field"><label for="signupEmail">사내 메일 주소</label><input class="auth-v2-input" id="signupEmail" type="email" placeholder="name@company.com" autocomplete="email" inputmode="email" required><p class="auth-v2-message is-error" id="signupEmailError" hidden>허용되지 않은 메일 도메인입니다.</p></div><button class="auth-v2-primary" type="button" data-signup-next="email">다음</button></section>
      <section class="signup-v2-step" data-signup-step="2" hidden><p class="signup-v2-step-count">STEP 2</p><h2>메일 인증</h2><p class="signup-v2-description"><b id="signupEmailDisplay"></b>로<br>인증번호를 보냈어요.</p><div class="auth-v2-field"><label for="signupCode">인증번호</label><div class="auth-v2-verify"><input class="auth-v2-input" id="signupCode" type="text" placeholder="인증번호 6자리" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button class="auth-v2-resend" id="signupResend" type="button">재발송</button></div><p class="auth-v2-message" id="signupCodeGuide">인증번호는 10분 동안 유효합니다.</p><p class="auth-v2-message is-error" id="signupCodeError" hidden>인증번호를 다시 확인해주세요.</p></div><button class="auth-v2-primary" type="button" data-signup-next="verify">확인</button></section>
      <section class="signup-v2-step" data-signup-step="3" hidden><p class="signup-v2-step-count">STEP 3</p><h2>비밀번호를<br>등록해주세요</h2><p class="signup-v2-description">로그인할 때 사용할 비밀번호를 설정해 주세요.</p><div class="auth-v2-field"><label for="signupPassword">비밀번호</label><input class="auth-v2-input" id="signupPassword" type="password" placeholder="8자 이상 입력" autocomplete="new-password" required><p class="auth-v2-message is-error" id="signupPasswordLengthError" hidden>비밀번호를 8자 이상 입력해주세요.</p></div><div class="auth-v2-field"><label for="signupPasswordConfirm">비밀번호 확인</label><input class="auth-v2-input" id="signupPasswordConfirm" type="password" placeholder="비밀번호를 다시 입력" autocomplete="new-password" required><p class="auth-v2-message is-error" id="signupPasswordError" hidden>비밀번호가 일치하지 않습니다.</p></div><button class="auth-v2-primary" type="submit">가입 완료</button></section>
    </form>
    <button class="auth-v2-back" id="signupBack" type="button"><span aria-hidden="true">←</span><span id="signupBackLabel">로그인으로 돌아가기</span></button>
  </section>
</main></div><script src="resources/js/auth.js"></script>
</body></html>
